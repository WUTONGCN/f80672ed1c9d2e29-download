name: Store package in repository

on:
  push:
    branches: [main]
    paths: ['.github/workflows/store-package.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  store:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Import and verify package
        shell: bash
        run: |
          set -euo pipefail
          git lfs install --local
          curl --fail --location --retry 3 --output f80672ed1c9d2e29.deb 'https://github.com/WUTONGCN/f80672ed1c9d2e29-download/releases/download/v1.0.0/f80672ed1c9d2e29.deb'
          printf '%s\n' '35ac88189ed91b60cff446fb6020ca60513ce20f985010d3c5b996115e3ec4a4  f80672ed1c9d2e29.deb' | sha256sum --check -
          git lfs track '*.deb'
          git add .gitattributes f80672ed1c9d2e29.deb
          git -c user.name='WUTONGCN' -c user.email='144403362+WUTONGCN@users.noreply.github.com' commit -m 'Store installation package in repository'
          git push origin HEAD:main
